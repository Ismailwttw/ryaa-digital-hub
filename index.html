<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYAA Digital Hub - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Content Management System</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-2">Select Category:</label>
                <select id="categorySelect" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Select Existing Category --</option>
                    <option value="tech">Tech & Gadgets</option>
                    <option value="digital">Digital Hub</option>
                    <option value="general">General Updates</option>
                </select>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Item Title / Heading:</label>
                <input type="text" id="catTitle" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter title or item name">
            </div>
            
            <div>
                <label class="block text-gray-700 font-medium mb-2">Content / Description:</label>
                <textarea id="catDesc" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter detailed content here..."></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="saveData()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                    Save Changes
                </button>
                <button onclick="deleteData()" class="px-4 bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700 transition duration-200">
                    Delete
                </button>
            </div>
        </div>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        function saveData() {
            const category = document.getElementById('categorySelect').value;
            const title = document.getElementById('catTitle').value;
            const desc = document.getElementById('catDesc').value;
            const status = document.getElementById('statusMessage');

            if(!category || (!title && !desc)) {
                status.style.color = 'red';
                status.innerText = 'Please select a category and fill in the details!';
                return;
            }

            status.style.color = 'green';
            status.innerText = 'Changes saved successfully!';
        }

        function deleteData() {
            const category = document.getElementById('categorySelect').value;
            const status = document.getElementById('statusMessage');

            if(!category) {
                status.style.color = 'red';
                status.innerText = 'Please select a category to delete!';
                return;
            }

            status.style.color = 'red';
            status.innerText = 'Selected category/item deleted successfully!';
        }
    </script>
</body>
</html>
