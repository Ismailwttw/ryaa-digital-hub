<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিয়া ডিজিটাল হাব - অ্যাডমিন ড্যাশবোর্ড</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">ওয়েবসাইট ম্যানেজমেন্ট প্যানেল</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-2">ক্যাটাগরি বা শিরোনাম:</label>
                <input type="text" id="catTitle" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="নতুন ক্যাটাগরির নাম লিখুন">
            </div>
            
            <div>
                <label class="block text-gray-700 font-medium mb-2">বিবরণ বা তথ্য:</label>
                <textarea id="catDesc" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="এখানে বিস্তারিত তথ্য লিখুন"></textarea>
            </div>

            <button onclick="saveData()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                পরিবর্তন সেভ করুন
            </button>
        </div>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        function saveData() {
            const title = document.getElementById('catTitle').value;
            const desc = document.getElementById('catDesc').value;
            const status = document.getElementById('statusMessage');

            if(!title && !desc) {
                status.style.color = 'red';
                status.innerText = 'দয়া করে অন্তত একটি ঘরে কিছু লিখুন!';
                return;
            }

            status.style.color = 'green';
            status.innerText = 'তথ্য সফলভাবে গ্রহণ করা হয়েছে!';
        }
    </script>
</body>
</html>
